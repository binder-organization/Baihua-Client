[package]
name = "baihua-client-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "baihua_client_tui"
path = "src/main.rs"

[dependencies]
baihua-core = { path = "../baihua-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.2" }
crossterm = { version = "0.29.0" }
rat-text = "3.1"
tungstenite = "0.30.0"
http = "1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["clock"] }
arboard = "3"
notify-rust = "4"
