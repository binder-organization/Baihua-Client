[package]
name = "baihua-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "baihua-client"

[dependencies]
eframe = "0.36.1"
graphician = { path = "../Graphician" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tungstenite = "0.30"
http = "1.5.0"
env_logger = "0.11"
base64 = "0.23.1"
rand = "0.10.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ed25519-dalek = { version = "3.0.0" }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
chrono = { version = "0.4", features = ["clock"] }
