# 三端各自独立发版：命令行版 `baihua`（cli-v<版本>）、图形版 `baihua-gui`（gui-v<版本>）、
# 终端版 `baihua-tui`（tui-v<版本>）。三端进度不统一，所以版本号、标签、安装包各走各的，
# 检查也各查各的：某一端只有在该版本的标签还不存在时才会构建并发布一次。
#
# 版本号取自各包自己的 Cargo.toml，发布说明取自各自的 changelog：
#   baihua-cli/Cargo.toml          + CHANGELOG_CLI.md   -> cli-v<版本>
#   baihua-client-gui/Cargo.toml   + CHANGELOG_GUI.md   -> gui-v<版本>
#   baihua-client-tui/Cargo.toml   + CHANGELOG_TUI.md   -> tui-v<版本>
#
# 因此"只更新一个 changelog 并改一个包的版本"只会发那一端；
# 若一次改动同时动了两三个包，则会同时发出对应的几个版本，互不干扰。
#
# 某一端要发版需要同时满足两条：该包 Cargo.toml 里的版本号在 changelog 里有对应的
# `## [版本]` 段；且该版本的标签还不存在。只改代码、没写 changelog 段的一端不会发版
# （prepare 任务会给一条 warning 说明），免得推一次代码就意外放出三端新版本。
# 每次构建产物：
#   baihua-cli-<版本>-<目标平台>.tar.gz / .zip  （包内是 `baihua` 与 config/）
#   baihua-gui-<版本>-<目标平台>.tar.gz / .zip  （包内是 `baihua-gui` 与 config/）
#   baihua-tui-<版本>-<目标平台>.tar.gz / .zip  （包内是 `baihua-tui` 与 config/）
# 每个包旁边都带一个同名 .sha256 摘要文件，客户端自动更新前会核对摘要。

name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 逐端读取版本、changelog 与已有标签：判断哪几端需要发版，并把需要构建的
  # （端 × 目标平台）组合拼成一份矩阵给下面的构建任务。
  # 判据是"该端版本的标签还不存在"，所以同一版本不会重复发布；
  # 三端各自判断、互不影响，一次也可以放出多个端。
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      cli_release: ${{ steps.metadata.outputs.cli_release }}
      cli_tag: ${{ steps.metadata.outputs.cli_tag }}
      cli_prerelease: ${{ steps.metadata.outputs.cli_prerelease }}
      cli_changelog: ${{ steps.metadata.outputs.cli_changelog }}
      gui_release: ${{ steps.metadata.outputs.gui_release }}
      gui_tag: ${{ steps.metadata.outputs.gui_tag }}
      gui_prerelease: ${{ steps.metadata.outputs.gui_prerelease }}
      gui_changelog: ${{ steps.metadata.outputs.gui_changelog }}
      tui_release: ${{ steps.metadata.outputs.tui_release }}
      tui_tag: ${{ steps.metadata.outputs.tui_tag }}
      tui_prerelease: ${{ steps.metadata.outputs.tui_prerelease }}
      tui_changelog: ${{ steps.metadata.outputs.tui_changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要看到仓库里已有的标签，才能判断某一端的这个版本是不是已经发过了
          fetch-depth: 0

      - name: Read versions, changelogs and existing tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          # 读取一个包 Cargo.toml 里的版本号
          read_version() {
            local manifest_path="$1"
            if [ ! -f "$manifest_path" ]; then
              return
            fi
            grep -m1 '^version' "$manifest_path" | sed 's/.*"\(.*\)".*/\1/'
          }

          # 取出 changelog 里当前版本那一段：`## [版本]` 到下一个 `## [` 之前
          read_changelog_section() {
            local changelog_path="$1"
            local version="$2"
            if [ ! -f "$changelog_path" ]; then
              return
            fi
            awk -v version="$version" '
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" version "]")) { found = 1 }
                next
              }
              found { print }
            ' "$changelog_path"
          }

          # 目标平台：| 分隔的四段是 目标三元组|runner|压缩包后缀|可执行文件后缀
          target_specifications=(
            "aarch64-apple-darwin|macos-latest|tar.gz|"
            "x86_64-apple-darwin|macos-latest|tar.gz|"
            "x86_64-pc-windows-msvc|windows-latest|zip|.exe"
            "x86_64-unknown-linux-gnu|ubuntu-latest|tar.gz|"
          )

          # 三端：| 分隔的六段是 产品名|包目录|标签前缀|安装包名前缀|可执行文件名|changelog 文件
          product_specifications=(
            "cli|baihua-cli|cli-v|baihua-cli-|baihua|CHANGELOG_CLI.md"
            "gui|baihua-client-gui|gui-v|baihua-gui-|baihua-gui|CHANGELOG_GUI.md"
            "tui|baihua-client-tui|tui-v|baihua-tui-|baihua-tui|CHANGELOG_TUI.md"
          )

          build_matrix_entries=""
          append_matrix_entry() {
            if [ -n "$build_matrix_entries" ]; then
              build_matrix_entries="${build_matrix_entries},"
            fi
            build_matrix_entries="${build_matrix_entries}${1}"
          }

          for product_specification in "${product_specifications[@]}"; do
            IFS='|' read -r product package_directory tag_prefix package_prefix executable_name changelog_file <<< "$product_specification"
            version="$(read_version "${package_directory}/Cargo.toml")"
            if [ -z "$version" ]; then
              echo "::error::cannot read the version from ${package_directory}/Cargo.toml"
              exit 1
            fi
            tag="${tag_prefix}${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              release="false"
            else
              release="true"
            fi
            case "$version" in
              *alpha*|*beta*|*rc*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
            changelog_body="$(read_changelog_section "$changelog_file" "$version")"
            if [ -z "$changelog_body" ]; then
              # 没有这一版的 changelog 段就说明这一端还没准备好发版：跳过，
              # 只在运行日志里给一条 warning，避免"推一次改动就顺带放出一个新版本"。
              if [ "$release" = "true" ]; then
                echo "::warning::${changelog_file} has no section for ${version}; the ${product} end is not released this time"
              fi
              release="false"
            fi
            {
              echo "${product}_release=${release}"
              echo "${product}_tag=${tag}"
              echo "${product}_prerelease=${prerelease}"
              echo "${product}_version=${version}"
              echo "${product}_changelog<<CHANGELOG_END"
              echo "$changelog_body"
              echo "CHANGELOG_END"
            } >> "$GITHUB_OUTPUT"
            echo "${product}: version ${version}, tag ${tag}, release ${release}"
            if [ "$release" = "true" ]; then
              for target_specification in "${target_specifications[@]}"; do
                IFS='|' read -r target runner archive_extension executable_extension <<< "$target_specification"
                append_matrix_entry "{\"product\":\"${product}\",\"package\":\"${package_directory}\",\"binary\":\"${executable_name}${executable_extension}\",\"version\":\"${version}\",\"tag\":\"${tag}\",\"package_prefix\":\"${package_prefix}\",\"target\":\"${target}\",\"runner\":\"${runner}\",\"archive_extension\":\"${archive_extension}\",\"standalone\":\"${package_prefix}${version}-${target}${executable_extension}\"}"
              done
            fi
          done
          echo "build_matrix=[${build_matrix_entries}]" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 无论这次要不要发版，每次都跑一遍格式、clippy 与测试
  # ---------------------------------------------------------------------------
  check:
    name: Lint and test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 构建矩阵：只包含这次需要发版的那几端，每端四个平台各一个 runner
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.product }} for ${{ matrix.target }}
    needs: [prepare, check]
    if: needs.prepare.outputs.build_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.product }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      # -- 打包（Unix） --------------------------------------------------------
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="${{ matrix.package_prefix }}${{ matrix.version }}-${{ matrix.target }}.tar.gz"
          staging="staging-${{ matrix.target }}"

          mkdir -p "${staging}/config"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${staging}/"
          cp -R config/. "${staging}/config/"

          tar -czf "${archive}" -C "${staging}" .
          shasum -a 256 "${archive}" > "${archive}.sha256"

          echo "archive=${archive}" >> "$GITHUB_ENV"
          rm -rf "${staging}"

      # -- 打包（Windows） -----------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${{ matrix.package_prefix }}${{ matrix.version }}-${{ matrix.target }}.zip"
          $staging = "staging-${{ matrix.target }}"

          New-Item -ItemType Directory -Force "${staging}\config" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "${staging}\"
          Copy-Item -Recurse config\* "${staging}\config\"

          Compress-Archive -Path "${staging}\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "${hash}  ${archive}" | Set-Content "${archive}.sha256"

          echo "archive=${archive}" >> $env:GITHUB_ENV
          Remove-Item -Recurse -Force $staging

      # -- 上传安装包与摘要 ----------------------------------------------------
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          retention-days: 30

      # -- 上传单独的可执行文件（供直接下载） ----------------------------------
      - name: Stage standalone executable
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.standalone }}"

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.standalone }}
          path: ${{ matrix.standalone }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 三端各自发布：某一端这次不需要发版时，对应任务整体跳过
  # ---------------------------------------------------------------------------
  release-cli:
    name: Publish command line release
    needs: [prepare, build]
    if: needs.prepare.outputs.cli_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download command line artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-cli-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the command line end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.cli_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.cli_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.cli_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"

  release-gui:
    name: Publish graphical release
    needs: [prepare, build]
    if: needs.prepare.outputs.gui_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download graphical artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-gui-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the graphical end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.gui_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.gui_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.gui_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"

  release-tui:
    name: Publish terminal release
    needs: [prepare, build]
    if: needs.prepare.outputs.tui_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download terminal artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-tui-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the terminal end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tui_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.tui_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.tui_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"
