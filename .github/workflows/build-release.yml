# The three ends release independently: `baihua` (cli-v<version>), `baihua-gui`
# (gui-v<version>) and `baihua-tui` (tui-v<version>). Versions, tags and packages are
# separate, and one end builds and publishes when its version is still unpublished.
#
# The version comes from each package's own Cargo.toml, the notes from its changelog:
#   baihua-cli/Cargo.toml          + CHANGELOG_CLI.md   -> cli-v<version>
#   baihua-client-gui/Cargo.toml   + CHANGELOG_GUI.md   -> gui-v<version>
#   baihua-client-tui/Cargo.toml   + CHANGELOG_TUI.md   -> tui-v<version>
#
# Updating one changelog and one package version therefore releases that end only,
# while a change touching several packages releases each of them side by side.
#
# An end releases when both hold: its Cargo.toml version has a `## [version]` section
# in its changelog, and the version has not been published yet. Code without a changelog section
# stays unpublished (the prepare job logs a warning), so a push never releases by accident.
# Artifacts of every build:
#   baihua-cli-<version>-<target>.tar.gz / .zip  (holding `baihua` and config/)
#   baihua-gui-<version>-<target>.tar.gz / .zip  (holding `baihua-gui` and config/)
#   baihua-tui-<version>-<target>.tar.gz / .zip  (holding `baihua-tui` and config/)
# Each package carries a matching .sha256 digest, which the client verifies before updating.

name: Build Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    name: Verify checked main commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify source and check result
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_EVENT: ${{ github.event.workflow_run.event }}
          CHECK_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECK_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$EVENT_NAME" = workflow_run ]; then
            [ "$CHECK_EVENT" = push ] && [ "$CHECK_BRANCH" = main ] && \
              [ "$CHECK_CONCLUSION" = success ] && [ "$CHECK_SHA" = "$main_sha" ]
          else
            [ "${GITHUB_REF}" = refs/heads/main ] && [ "$GITHUB_SHA" = "$main_sha" ]
          fi
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${main_sha}\")] | sort_by(.updated_at // .run_started_at // .created_at, .id) | last | .conclusion // empty")"
          [ "$latest" = success ] || { echo "latest main CI for ${main_sha} is ${latest:-missing}" >&2; exit 1; }
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Read each end's version, changelog and existing tags, decide which ends release,
  # and build the end/target manifest plus a target-grouped build matrix.
  # A managed draft for the same SHA may be resumed after an interrupted run.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release metadata
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      release_matrix: ${{ steps.metadata.outputs.release_matrix }}
      cli_release: ${{ steps.metadata.outputs.cli_release }}
      cli_tag: ${{ steps.metadata.outputs.cli_tag }}
      cli_prerelease: ${{ steps.metadata.outputs.cli_prerelease }}
      cli_changelog: ${{ steps.metadata.outputs.cli_changelog }}
      gui_release: ${{ steps.metadata.outputs.gui_release }}
      gui_tag: ${{ steps.metadata.outputs.gui_tag }}
      gui_prerelease: ${{ steps.metadata.outputs.gui_prerelease }}
      gui_changelog: ${{ steps.metadata.outputs.gui_changelog }}
      tui_release: ${{ steps.metadata.outputs.tui_release }}
      tui_tag: ${{ steps.metadata.outputs.tui_tag }}
      tui_prerelease: ${{ steps.metadata.outputs.tui_prerelease }}
      tui_changelog: ${{ steps.metadata.outputs.tui_changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # The existing tags are needed to tell whether this version was released
          fetch-depth: 0

      - name: Read versions, changelogs and existing tags
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail

          # Read the version out of one package's Cargo.toml
          read_version() {
            local manifest_path="$1"
            if [ ! -f "$manifest_path" ]; then
              return
            fi
            grep -m1 '^version' "$manifest_path" | sed 's/.*"\(.*\)".*/\1/'
          }

          # Take the changelog section of this version: `## [version]` up to the next one
          read_changelog_section() {
            local changelog_path="$1"
            local version="$2"
            if [ ! -f "$changelog_path" ]; then
              return
            fi
            awk -v version="$version" '
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" version "]")) { found = 1 }
                next
              }
              found { print }
            ' "$changelog_path"
          }

          # Targets: five fields are triplet, runner, archive suffix,
          # executable suffix and the installer kind for that target.
          target_specifications=(
            "aarch64-apple-darwin|macos-latest|tar.gz||dmg"
            "x86_64-apple-darwin|macos-latest|tar.gz||dmg"
            "x86_64-pc-windows-msvc|windows-latest|zip|.exe|msi"
            "x86_64-unknown-linux-gnu|ubuntu-latest|tar.gz||appimage"
            "aarch64-linux-android|ubuntu-latest|apk||apk"
            "aarch64-apple-ios|macos-latest|ipa||ipa"
          )

          # Ends: seven fields are product, package, tag prefix, package prefix,
          # binary, changelog and the bundle name an installer package uses.
          product_specifications=(
            "cli|baihua-cli|cli-v|baihua-cli-|baihua|CHANGELOG_CLI.md"
            "gui|baihua-client-gui|gui-v|baihua-gui-|baihua-gui|CHANGELOG_GUI.md|Baihua"
            "tui|baihua-client-tui|tui-v|baihua-tui-|baihua-tui|CHANGELOG_TUI.md"
          )

          build_matrix_entries=""
          append_matrix_entry() {
            if [ -n "$build_matrix_entries" ]; then
              build_matrix_entries="${build_matrix_entries},"
            fi
            build_matrix_entries="${build_matrix_entries}${1}"
          }

          for product_specification in "${product_specifications[@]}"; do
            IFS='|' read -r product package_directory tag_prefix package_prefix executable_name changelog_file bundle_name <<< "$product_specification"
            version="$(read_version "${package_directory}/Cargo.toml")"
            if [ -z "$version" ]; then
              echo "::error::cannot read the version from ${package_directory}/Cargo.toml"
              exit 1
            fi
            tag="${tag_prefix}${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              release="false"
              existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
              if [ -n "$existing" ] && \
                 [ "$(jq -r '.draft' <<< "$existing")" = true ] && \
                 [ "$(jq -r '.target_commitish' <<< "$existing")" = "$RELEASE_SHA" ] && \
                 [[ "$(jq -r '.body' <<< "$existing")" == *"baihua-release-run:"*"sha:${RELEASE_SHA} -->"* ]]; then
                release="true"
              fi
            else
              release="true"
            fi
            case "$version" in
              *alpha*|*beta*|*rc*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
            changelog_body="$(read_changelog_section "$changelog_file" "$version")"
            if [ -z "$changelog_body" ]; then
              # No changelog section for this version means the end is not ready to
              # release: skip it and log a warning, so a push never releases by accident.
              if [ "$release" = "true" ]; then
                echo "::warning::${changelog_file} has no section for ${version}; the ${product} end is not released this time"
              fi
              release="false"
            fi
            {
              echo "${product}_release=${release}"
              echo "${product}_tag=${tag}"
              echo "${product}_prerelease=${prerelease}"
              echo "${product}_version=${version}"
              echo "${product}_changelog<<CHANGELOG_END"
              echo "$changelog_body"
              echo "CHANGELOG_END"
            } >> "$GITHUB_OUTPUT"
            echo "${product}: version ${version}, tag ${tag}, release ${release}"
            if [ "$release" = "true" ]; then
              for target_specification in "${target_specifications[@]}"; do
                IFS='|' read -r target runner archive_extension executable_extension package_kind <<< "$target_specification"
                case "$package_kind" in
                  apk|ipa)
                    # Phone installers exist for the graphical end only: the
                    # command line and terminal ends keep the desktop triples.
                    [ "$product" = "gui" ] || continue
                    ;;
                esac
                append_matrix_entry "{\"product\":\"${product}\",\"package\":\"${package_directory}\",\"binary\":\"${executable_name}${executable_extension}\",\"version\":\"${version}\",\"tag\":\"${tag}\",\"package_prefix\":\"${package_prefix}\",\"target\":\"${target}\",\"runner\":\"${runner}\",\"package_kind\":\"${package_kind}\",\"bundle_name\":\"${bundle_name}\",\"archive_extension\":\"${archive_extension}\",\"standalone\":\"${package_prefix}${version}-${target}${executable_extension}\"}"
              done
            fi
          done
          release_matrix="[${build_matrix_entries}]"
          echo "release_matrix=${release_matrix}" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$(jq -c 'group_by(.target) | map({target:.[0].target, runner:.[0].runner, package_kind:.[0].package_kind, products:(map(.product) | join(","))})' <<< "$release_matrix")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One runner per target compiles all selected desktop ends together.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: [gate, prepare]
    if: needs.prepare.outputs.build_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Start build timer
        shell: bash
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build selected desktop binaries together
        if: matrix.package_kind != 'apk' && matrix.package_kind != 'ipa'
        shell: bash
        run: |
          packages=()
          case ",${{ matrix.products }}," in *,cli,*) packages+=(-p baihua-cli) ;; esac
          case ",${{ matrix.products }}," in *,gui,*) packages+=(-p baihua-client-gui) ;; esac
          case ",${{ matrix.products }}," in *,tui,*) packages+=(-p baihua-client-tui) ;; esac
          cargo build --locked --release --target '${{ matrix.target }}' "${packages[@]}"

      # -- Toolchains only installer kinds need (each cheap, each conditional) --
      - name: Cache the Windows installer builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'msi'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Windows installer builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'msi'
        shell: bash
        run: |
          if ! command -v cargo-wix >/dev/null; then
            cargo install cargo-wix --version 0.3.9 --locked
          fi

      - name: Cache the Android debug keystore
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'apk'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: baihua-android-debug-keystore

      - name: Cache the Android installer builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'apk'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Android toolchain
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'apk'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.CARGO_APK_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEY_PASSWORD }}
        run: |
          if ! command -v cargo-apk >/dev/null; then
            cargo install cargo-apk --locked
          fi
          # The runner image ships an NDK already; install one only when none
          # exists. sdkmanager lives under cmdline-tools, not on the PATH.
          if ! ls "${ANDROID_HOME}/ndk" > /dev/null 2>&1; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;27.2.12479018" > /dev/null
          fi

          # Signing prefers a release keystore from the repository secrets; the
          # debug fallback is cached across runs so releases can update each other.
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode \
              > "${RUNNER_TEMP}/baihua-release.keystore"
            {
              echo "CARGO_APK_RELEASE_KEYSTORE=${RUNNER_TEMP}/baihua-release.keystore"
              echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=${RELEASE_KEYSTORE_PASSWORD}"
              echo "CARGO_APK_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              echo "CARGO_APK_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          elif [ ! -f "${HOME}/.android/debug.keystore" ]; then
            mkdir -p "${HOME}/.android"
            keytool -genkeypair \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          test -f "${HOME}/.android/debug.keystore" || [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]

      - name: Cache macOS packaging Python wheels
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'dmg'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: dmgbuild-pip-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install the macOS disk image builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'dmg'
        shell: bash
        run: |
          python3 -m venv "$HOME/dmgbuild-environment"
          "$HOME/dmgbuild-environment/bin/pip" install dmgbuild
          echo "DMGBUILD_PYTHON=$HOME/dmgbuild-environment/bin/python3" >> "$GITHUB_ENV"

      - name: Cache the Linux AppImage builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'appimage'
        uses: actions/cache@v4
        with:
          path: ~/linuxdeploy
          key: linuxdeploy-x86_64-v1

      - name: Install the Linux AppImage builder
        if: contains(matrix.products, 'gui') && matrix.package_kind == 'appimage'
        shell: bash
        run: |
          if [ ! -s "$HOME/linuxdeploy" ]; then
            curl -fL -o "$HOME/linuxdeploy" \
              https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          fi
          chmod +x "$HOME/linuxdeploy"
          echo "LINUXDEPLOY=$HOME/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # -- Bundle ends: one installer package per platform --------------
      # Every kind routes through scripts/build_packages.sh, the same entry a
      # developer runs locally, so CI and the machine can never diverge.
      - name: Package the installer bundle
        if: contains(matrix.products, 'gui')
        shell: bash
        run: |
          case "${{ matrix.package_kind }}" in
            dmg)
              case "${{ matrix.target }}" in
                aarch64*) arch=arm ;;
                *) arch=x86 ;;
              esac
              scripts/build_packages.sh --end gui --platform mac --arch "$arch" --skip-build
              ;;
            msi) scripts/build_packages.sh --end gui --platform windows --skip-build ;;
            appimage) scripts/build_packages.sh --end gui --platform linux --skip-build ;;
            apk) scripts/build_packages.sh --end gui --platform android ;;
            ipa)
              scripts/build_packages.sh --end gui --platform ios
              ;;
          esac

      - name: Package command line and terminal binaries
        if: matrix.package_kind != 'apk' && matrix.package_kind != 'ipa'
        shell: bash
        env:
          PRODUCTS: ${{ matrix.products }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/package_release_binaries.sh

      - name: Verify staged artifacts
        shell: bash
        env:
          RELEASE_MATRIX: ${{ needs.prepare.outputs.release_matrix }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/verify_release_target.sh

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Report build duration
        if: always()
        shell: bash
        run: |
          if [ -n "${BUILD_STARTED:-}" ]; then
            elapsed=$(( ($(date +%s) - BUILD_STARTED) / 60 ))
            echo "${{ matrix.target }} build: ${elapsed} minutes" >> "$GITHUB_STEP_SUMMARY"
            if [ "$elapsed" -gt 35 ]; then
              echo "::warning::${{ matrix.target }} build exceeded the 35-minute budget"
            fi
          fi

  # Publish the complete set in one job. The script verifies every expected asset
  # before it creates drafts and deletes only drafts/releases marked for this run.
  publish:
    name: Verify and publish release set
    needs: [gate, prepare, build]
    if: needs.prepare.outputs.build_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      BUILD_MATRIX: ${{ needs.prepare.outputs.release_matrix }}
      CLI_ENABLED: ${{ needs.prepare.outputs.cli_release }}
      CLI_TAG: ${{ needs.prepare.outputs.cli_tag }}
      CLI_PRERELEASE: ${{ needs.prepare.outputs.cli_prerelease }}
      CLI_NOTES: ${{ needs.prepare.outputs.cli_changelog }}
      GUI_ENABLED: ${{ needs.prepare.outputs.gui_release }}
      GUI_TAG: ${{ needs.prepare.outputs.gui_tag }}
      GUI_PRERELEASE: ${{ needs.prepare.outputs.gui_prerelease }}
      GUI_NOTES: ${{ needs.prepare.outputs.gui_changelog }}
      TUI_ENABLED: ${{ needs.prepare.outputs.tui_release }}
      TUI_TAG: ${{ needs.prepare.outputs.tui_tag }}
      TUI_PRERELEASE: ${{ needs.prepare.outputs.tui_prerelease }}
      TUI_NOTES: ${{ needs.prepare.outputs.tui_changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify assets and publish
        shell: bash
        run: bash scripts/publish_releases.sh

  cleanup:
    name: Clean failed release run
    needs: [gate, prepare, build, publish]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.build_matrix != '[]' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Delete this run's managed releases and owned tags
        shell: bash
        run: bash scripts/cleanup_release_run.sh
