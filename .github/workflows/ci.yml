name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start check timer
        run: echo "CHECK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse a successful weekly check for an identical main commit
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          # Any change to compilation inputs requires a fresh check.
          if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '(^Cargo.lock$|(^|/)Cargo.toml$|^rust-toolchain.toml$|^\.github/workflows/|^\.cargo/)'; then
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
            --jq '[.statuses[] | select(.context == "weekly-ci/lint-and-test-v1-rust-1.98.1")][0].state' \
            | grep -qx success; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Identical SHA passed the weekly check' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.reuse.outputs.skip != 'true'
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.reuse.outputs.skip != 'true'
      - name: Format
        if: steps.reuse.outputs.skip != 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.reuse.outputs.skip != 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.reuse.outputs.skip != 'true'
        run: cargo test --locked --workspace
      - name: Report check duration
        if: always()
        run: |
          if [ -n "${CHECK_STARTED:-}" ]; then
            elapsed=$(( ($(date +%s) - CHECK_STARTED) / 60 ))
            echo "CI check: ${elapsed} minutes" >> "$GITHUB_STEP_SUMMARY"
            if [ "$elapsed" -gt 25 ]; then
              echo "::warning::CI check exceeded the 25-minute budget"
            fi
          fi
