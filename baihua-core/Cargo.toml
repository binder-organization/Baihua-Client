[package]
name = "baihua-core"
version = "0.2.0"
edition = "2024"

[lib]
name = "baihua_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
thiserror = "2"
tungstenite = "0.30.0"
http = "1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10.2"
